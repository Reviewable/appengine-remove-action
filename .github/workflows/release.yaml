name: Tag release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    uses: reviewable/actions/.github/workflows/release.yaml@master
    with:
      node_version: '26'
      checkout_submodules: true
      install_command: |
        command -v corepack >/dev/null || npm install --global corepack@0.36.0
        corepack enable && yarn install --immutable
      build_command: yarn build
